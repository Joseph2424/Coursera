name: Playwright NUnit E2E

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: |
          dotnet restore PortfolioTracker.sln
          dotnet build PortfolioTracker.sln --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./e2e/Portfolio.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run NUnit E2E tests
        run: dotnet test PortfolioTracker.sln --no-build --logger "trx;LogFileName=playwright-e2e.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14